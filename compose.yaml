# MarketGuard 로컬 패키징: PostgreSQL + 앱(prod 프로파일, Flyway 마이그레이션 적용)
# 실행 전 토스 키를 환경변수(또는 .env)로 준비:
#   $env:TOSS_CLIENT_ID="..."; $env:TOSS_CLIENT_SECRET="..."; docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketguard
      POSTGRES_USER: marketguard
      POSTGRES_PASSWORD: marketguard
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/marketguard
      SPRING_DATASOURCE_USERNAME: marketguard
      SPRING_DATASOURCE_PASSWORD: marketguard
      COLLECTOR_ENABLED: "true"
      # 시크릿은 호스트 환경변수/.env 에서 주입(미설정 시 기동 중단)
      TOSS_CLIENT_ID: ${TOSS_CLIENT_ID:?TOSS_CLIENT_ID 를 설정하세요}
      TOSS_CLIENT_SECRET: ${TOSS_CLIENT_SECRET:?TOSS_CLIENT_SECRET 를 설정하세요}
    ports:
      - "5050:5050"

name: marketguard

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketguard}
      POSTGRES_USER: ${POSTGRES_USER:-marketguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-marketguard}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-marketguard}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MARKETGUARD_ADMIN_USERNAME: ${MARKETGUARD_ADMIN_USERNAME:-}
      MARKETGUARD_ADMIN_PASSWORD: ${MARKETGUARD_ADMIN_PASSWORD:-}
      MARKETGUARD_SECURITY_ENABLED: ${MARKETGUARD_SECURITY_ENABLED:-true}
      MARKETGUARD_OPERATOR_TOKEN: ${MARKETGUARD_OPERATOR_TOKEN:-}
      MARKETGUARD_ALLOWED_ORIGINS: ${MARKETGUARD_ALLOWED_ORIGINS:-http://localhost:5050}
      COLLECTOR_ENABLED: ${COLLECTOR_ENABLED:-false}
      TOSS_CLIENT_ID: ${TOSS_CLIENT_ID:-}
      TOSS_CLIENT_SECRET: ${TOSS_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${HOST_PORT:-5050}:5050"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:5050/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped

volumes:
  postgres-data:

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MarketGuard — 시장감시 관제</title>
    <style>
        :root { color-scheme: light dark; }
        body { font-family: system-ui, "Segoe UI", sans-serif; margin: 0; background: #0f1115; color: #e8eaed; }
        header { padding: 16px 24px; border-bottom: 1px solid #272b33; display: flex; align-items: center; gap: 16px; }
        h1 { font-size: 18px; margin: 0; }
        .status { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: #3a2020; color: #ff8a8a; }
        .status.on { background: #16321f; color: #6ee7a0; }
        main { padding: 16px 24px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid #21242b; }
        th { color: #9aa0aa; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
        tr.new { animation: flash 1.2s ease-out; }
        @keyframes flash { from { background: #1d2b1f; } to { background: transparent; } }
        .sev { font-weight: 700; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
        .sev.CRITICAL { background: #4a1414; color: #ff6b6b; }
        .sev.WARNING { background: #3d2e10; color: #ffc14d; }
        .sev.INFO { background: #20262e; color: #9aa0aa; }
        .empty { color: #6b7280; padding: 24px 12px; }
        code { color: #8ab4f8; }
    </style>
</head>
<body>
<header>
    <h1>🛡️ MarketGuard 관제</h1>
    <span id="status" class="status">● 연결 끊김</span>
    <span style="font-size:13px;color:#6b7280;">이상거래 실시간 탐지</span>
</header>
<main>
    <table>
        <thead>
        <tr><th>시각</th><th>종목</th><th>룰</th><th>심각도</th><th>메시지</th></tr>
        </thead>
        <tbody id="rows">
        <tr><td colspan="5" class="empty">탐지 내역을 기다리는 중…</td></tr>
        </tbody>
    </table>
</main>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
    const RULE_LABELS = {
        PRICE_LIMIT: "가격제한폭", PRICE_SPIKE: "가격 급변동",
        VOLUME_SURGE: "거래량 급증", ORDERBOOK_IMBALANCE: "호가 불균형",
        INVESTMENT_WARNING: "투자경고"
    };
    const rows = document.getElementById("rows");
    let empty = true;

    function fmtTime(iso) {
        if (!iso) return "-";
        const d = new Date(iso);
        return isNaN(d) ? iso : d.toLocaleTimeString("ko-KR");
    }

    function addRow(a, isNew) {
        if (empty) { rows.innerHTML = ""; empty = false; }
        const tr = document.createElement("tr");
        if (isNew) tr.className = "new";
        tr.innerHTML =
            `<td>${fmtTime(a.detectedAt)}</td>` +
            `<td><code>${a.stockCode ?? "-"}</code></td>` +
            `<td>${RULE_LABELS[a.ruleType] ?? a.ruleType}</td>` +
            `<td><span class="sev ${a.severity}">${a.severity}</span></td>` +
            `<td>${a.message ?? ""}</td>`;
        rows.prepend(tr);
    }

    function setStatus(on) {
        const el = document.getElementById("status");
        el.textContent = on ? "● 연결됨" : "● 연결 끊김";
        el.className = "status" + (on ? " on" : "");
    }

    // 1) 과거 탐지 내역 로드
    fetch("/api/anomalies")
        .then(r => r.json())
        .then(list => list.slice().reverse().forEach(a => addRow(a, false)))
        .catch(() => {});

    // 2) 실시간 구독
    function connect() {
        const stomp = Stomp.over(new SockJS("/ws"));
        stomp.debug = null;
        stomp.connect({}, () => {
            setStatus(true);
            stomp.subscribe("/topic/anomalies", msg => addRow(JSON.parse(msg.body), true));
        }, () => { setStatus(false); setTimeout(connect, 3000); });
    }
    connect();
</script>
</body>
</html>

# 서버: 0.0.0.0 에 바인딩되어 같은 네트워크/공인IP로 접속 가능. 8080 대신 5050 사용.
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:5050}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: marketguard
  datasource:
    url: jdbc:h2:mem:marketguard;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop      # 로컬(H2)은 Hibernate가 스키마 생성. 운영(prod)은 Flyway가 담당.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false               # 로컬 기본 비활성. prod 프로파일에서 PostgreSQL에 대해 활성화.
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

marketguard:
  security:
    enabled: ${MARKETGUARD_SECURITY_ENABLED:false}
    username: ${MARKETGUARD_ADMIN_USERNAME:}
    password: ${MARKETGUARD_ADMIN_PASSWORD:}
    allowed-origins:
      - http://localhost:5050
      - http://127.0.0.1:5050
    requests-per-minute: ${MARKETGUARD_REQUESTS_PER_MINUTE:120}

# 토스증권 Open API 연동 설정 (시크릿은 환경변수로 주입)
toss:
  base-url: https://openapi.tossinvest.com
  auth-url: https://openapi.tossinvest.com/oauth2/token   # POST /oauth2/token (grant_type=client_credentials)
  client-id: ${TOSS_CLIENT_ID:}
  client-secret: ${TOSS_CLIENT_SECRET:}
  http:
    connect-timeout: 2s
    read-timeout: 5s
    max-attempts: 3
    initial-backoff: 300ms
    max-backoff: 5s
    jitter-factor: 0.5
    max-retry-after: 30s
  watch-list:                  # 실시간 시세 보드 + 심층 탐지(호가·캔들) 대상 (소수 포커스 종목)
    - "005930"   # 삼성전자
    - "000660"   # SK하이닉스
    - "373220"   # LG에너지솔루션
    - "207940"   # 삼성바이오로직스
    - "005380"   # 현대차
    - "000270"   # 기아
    - "005490"   # POSCO홀딩스
    - "035420"   # NAVER
    - "035720"   # 카카오
    - "105560"   # KB금융
    - "051910"   # LG화학
    - "006400"   # 삼성SDI
    - "028260"   # 삼성물산
    - "012330"   # 현대모비스
    - "066570"   # LG전자
    - "055550"   # 신한지주
    - "086790"   # 하나금융지주
    - "015760"   # 한국전력
    - "034730"   # SK
    - "018260"   # 삼성에스디에스

# 전 종목 이상거래 스캔 스케줄러
collector:
  enabled: ${COLLECTOR_ENABLED:false}
  poll-interval-ms: 30000        # 전 종목 가격 스캔 주기(ms). 유니버스가 크면 늘리세요(예: 60000).

# 스캔 대상 종목 유니버스
scan:
  # 전 시장 감시: KRX 전종목 CSV(또는 코드 목록) 파일 경로를 지정하면 그 안의 6자리 코드 전부를 스캔.
  # 비우면 classpath:symbols.txt(시연 시드)를 사용. KRX 정보데이터시스템에서 전종목 CSV를 받아 경로만 넣으세요.
  symbols-file: ${SCAN_SYMBOLS_FILE:}
  # 정규장(평일 09:00~15:30 KST)에만 스캔. 장 마감 중 직전 장 데이터 오탐 방지. 테스트로 강제 스캔하려면 false.
  market-hours-only: ${SCAN_MARKET_HOURS_ONLY:true}

# 실시간 시세 보드: watch-list 종목을 주기적으로 받아 WebSocket(/topic/prices)으로 푸시
board:
  push-interval-ms: 2000         # 현재가 푸시 주기(ms)
  detail-refresh-ms: 15000       # 전일종가·거래량·미니캔들 갱신 주기(ms, 호출량 절감용)

# 토스 종목 기본 정보는 영업일 단위로 갱신되므로 하루 동안 캐시
stock-reference:
  refresh-ms: 86400000

scheduling:
  pool-size: 3

maintenance:
  snapshot-cleanup-interval: 10m
  snapshot-retention: 1h

# 탐지 룰 임계치
detection:
  cooldown-ms: 600000        # 같은 (종목,룰) 신호 재발생 억제 시간(ms). 동일 알림 도배 방지.
  price-spike:
    threshold-percent: 3.0   # 직전 평균가 대비 ±N% 이상 변동이면 이상
    lookback: 20             # 평균 계산에 사용할 직전 스냅샷 수
  price-limit:
    proximity-percent: 1.0   # 상·하한가 1% 이내 근접 시 경고(0이면 도달만 탐지)
  orderbook-imbalance:
    ratio-threshold: 3.0     # 매수/매도 총잔량 비율이 N배 이상이면 이상
  volume-surge:
    multiplier: 3.0          # 직전 봉 평균 거래량 대비 N배 이상이면 이상
    lookback: 20

# 동일 종목 신호를 검토 가능한 사건으로 묶고 설명 가능한 관심도 점수를 계산한다.
surveillance:
  grouping-window: 10m
  inactivity-timeout: 20m
  reactivation-window: 30m
  lifecycle-interval: 1m
  simultaneous-signal-bonus: 10
  max-score: 100
  medium-threshold: 30
  high-threshold: 60
  rule-weights:
    PRICE_SPIKE: 25
    VOLUME_SURGE: 25
    ORDERBOOK_IMBALANCE: 20
    PRICE_LIMIT: 15
    INVESTMENT_WARNING: 15
    PRICE_VOLUME_SURGE: 35

logging:
  level:
    com.marketguard: INFO

spring:
  application:
    name: marketguard
  datasource:
    url: jdbc:h2:mem:marketguard;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop      # Phase 4에서 Flyway로 전환 예정
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# 토스증권 Open API 연동 설정 (시크릿은 환경변수로 주입)
toss:
  base-url: https://openapi.tossinvest.com
  auth-url: https://openapi.tossinvest.com/oauth2/token   # POST /oauth2/token (grant_type=client_credentials)
  client-id: ${TOSS_CLIENT_ID:}
  client-secret: ${TOSS_CLIENT_SECRET:}
  account-id: ${TOSS_ACCOUNT_ID:}   # 선택: 계좌/주문 API 전용. 시세만 쓰는 본 프로젝트에선 불필요
  watch-list:                  # 실시간 시세 보드 + 심층 탐지(호가·캔들) 대상 (소수 포커스 종목)
    - "005930"   # 삼성전자
    - "000660"   # SK하이닉스
    - "373220"   # LG에너지솔루션
    - "207940"   # 삼성바이오로직스
    - "005380"   # 현대차
    - "000270"   # 기아
    - "005490"   # POSCO홀딩스
    - "035420"   # NAVER
    - "035720"   # 카카오
    - "105560"   # KB금융

# 전 종목 이상거래 스캔 스케줄러 (대상 종목코드는 classpath:symbols.txt, 없으면 watch-list로 폴백)
collector:
  enabled: ${COLLECTOR_ENABLED:false}
  poll-interval-ms: 30000        # 전 종목 가격 스캔 주기(ms). 유니버스가 크면 늘리세요.

# 실시간 시세 보드: watch-list 종목을 주기적으로 받아 WebSocket(/topic/prices)으로 푸시
board:
  push-interval-ms: 2000

# 탐지 룰 임계치
detection:
  price-spike:
    threshold-percent: 3.0   # 직전 평균가 대비 ±N% 이상 변동이면 이상
    lookback: 20             # 평균 계산에 사용할 직전 스냅샷 수
  price-limit:
    proximity-percent: 1.0   # 상·하한가 1% 이내 근접 시 경고(0이면 도달만 탐지)
  orderbook-imbalance:
    ratio-threshold: 3.0     # 매수/매도 총잔량 비율이 N배 이상이면 이상
  volume-surge:
    multiplier: 3.0          # 직전 봉 평균 거래량 대비 N배 이상이면 이상
    lookback: 20

logging:
  level:
    com.marketguard: INFO

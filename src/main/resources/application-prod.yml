# 운영(prod) 프로파일: PostgreSQL + Flyway 마이그레이션
# 시크릿/접속정보는 환경변수로 주입(Docker Compose 등). 예: SPRING_DATASOURCE_URL, TOSS_CLIENT_ID ...
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate         # Flyway 적용 뒤 엔티티-스키마 계약을 검증
  flyway:
    enabled: true                # db/migration 의 버전 스크립트를 기동 시 적용
  h2:
    console:
      enabled: false

logging:
  level:
    com.marketguard: INFO

server:
  address: 0.0.0.0

marketguard:
  security:
    enabled: ${MARKETGUARD_SECURITY_ENABLED:true}
    username: ${MARKETGUARD_ADMIN_USERNAME:}
    password: ${MARKETGUARD_ADMIN_PASSWORD:}
    allowed-origins: ${MARKETGUARD_ALLOWED_ORIGINS:}
